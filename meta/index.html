<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meta Analysis</title>

  <link rel="stylesheet" href="../style.css" />

  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>
</head>

<body>
  <h1>Meta</h1>

  <p>
    An analysis of the code and commit history behind my DSC 106 portfolio.
  </p>

  <!-- ======================================================
       SUMMARY
       ====================================================== -->

  <h2>Summary</h2>

  <div class="commit-filter">
    <label for="commit-progress">
      Show commits until:
      <time id="commit-time-filter"></time>
    </label>

    <input
      type="range"
      id="commit-progress"
      min="0"
      max="100"
      value="100"
    />
  </div>

  <div id="stats"></div>


  <!-- ======================================================
       COMMIT SCATTERPLOT
       ====================================================== -->

  <h2>Commits by time of day</h2>

  <div id="chart"></div>

  <p id="selection-count">
    No commits selected
  </p>

  <dl
    id="language-breakdown"
    class="stats"
  ></dl>


  <!-- ======================================================
       LAB 8 — UNIT VISUALIZATION
       ====================================================== -->

  <h2>Files</h2>

  <div id="files"></div>


  <!-- ======================================================
       COMMIT TOOLTIP
       ====================================================== -->

  <dl
    id="commit-tooltip"
    class="info tooltip"
    hidden
  >

    <dt>Commit</dt>

    <dd>
      <a
        href=""
        id="commit-link"
        target="_blank"
      ></a>
    </dd>


    <dt>Date</dt>

    <dd id="commit-date"></dd>


    <dt>Time</dt>

    <dd id="commit-time"></dd>


    <dt>Author</dt>

    <dd id="commit-author"></dd>


    <dt>Lines edited</dt>

    <dd id="commit-lines"></dd>

  </dl>

</body>
</html>
